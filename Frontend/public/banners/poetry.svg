      <stop offset="0%" stop-color="#2c5698"/>
      <stop offset="50%" stop-color="#6788ae"/>
      <stop offset="100%" stop-color="#b0813f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <g opacity="0.35" fill="none" stroke="#fbeed8" stroke-width="3">
